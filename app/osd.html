<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>JLC OSD</title>
    <style>
      /* 字号一律用 vh：窗口按 Scale 等比放大后，内容自动跟着缩放 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Noto Sans CJK SC', 'Source Han Sans SC', system-ui, sans-serif;
        -webkit-user-select: none;
      }
      :root {
        --accent: #8b5cf6;
        --anim: 180ms;
        --bg-alpha: 0.92;
      }
      .stage {
        position: absolute;
        inset: 5.4vh;
        display: flex;
      }
      .pill {
        box-sizing: border-box;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12.5vh;
        padding: 0 19.6vh;
        border-radius: 14.3vh;
        border: 1.5px solid var(--accent);
        background: rgb(13 16 32 / var(--bg-alpha));
        color: #eef1ff;
        box-shadow:
          0 1vh 3vh rgb(0 0 0 / 0.45),
          0 0 0 1px rgb(255 255 255 / 0.04) inset;
        opacity: 0;
        transition:
          opacity var(--anim) ease,
          transform var(--anim) cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      /* 从屏幕左/右边缘水平滑出，收起时原路滑回 */
      .pill.from-left {
        transform: translateX(-112%);
      }
      .pill.from-right {
        transform: translateX(112%);
      }
      .pill.show {
        opacity: 1;
        transform: none;
      }
      .icon {
        flex: none;
        width: 46.4vh;
        height: 46.4vh;
        border-radius: 14.3vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .icon svg {
        width: 25vh;
        height: 25vh;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .body {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-size: 10.7vh;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: #9aa3c7;
      }
      .value {
        font-size: 26.8vh;
        font-weight: 800;
        line-height: 1.2;
        margin-top: 1.6vh;
        white-space: nowrap;
      }
      .sub {
        font-size: 8.9vh;
        letter-spacing: 0.14em;
        color: #7f89ad;
      }
      .bar {
        display: none;
        margin: 4.5vh 0 3.6vh;
        height: 4.5vh;
        border-radius: 99px;
        background: rgb(255 255 255 / 0.1);
        overflow: hidden;
      }
      .bar.on {
        display: block;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 99px;
        background: var(--accent);
        transition: width var(--anim) ease;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="pill" id="pill">
        <div class="icon" id="icon"></div>
        <div class="body">
          <div class="title" id="title"></div>
          <div class="value" id="value"></div>
          <div class="bar" id="bar"><i id="fill"></i></div>
          <div class="sub" id="sub"></div>
        </div>
      </div>
    </div>
    <script>
      const ICONS = {
        perf: '<path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l3.6-3.6"/><circle cx="12" cy="15" r="1.4"/>',
        fan: '<circle cx="12" cy="12" r="1.8"/><path d="M12 10.2c-.6-3.6.4-6.2 2.4-6.6 2-.4 3.6 1.4 3.4 3.4-.2 2-2.2 3.4-4.2 3.4"/><path d="M13.8 12c3.6-.6 6.2.4 6.6 2.4.4 2-1.4 3.6-3.4 3.4-2-.2-3.4-2.2-3.4-4.2"/><path d="M12 13.8c.6 3.6-.4 6.2-2.4 6.6-2 .4-3.6-1.4-3.4-3.4.2-2 2.2-3.4 4.2-3.4"/><path d="M10.2 12c-3.6.6-6.2-.4-6.6-2.4-.4-2 1.4-3.6 3.4-3.4 2 .2 3.4 2.2 3.4 4.2"/>',
        keyboard:
          '<rect x="2.5" y="6" width="19" height="12" rx="2.6"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8.5 14h7"/>',
        touchpad: '<rect x="5" y="2.5" width="14" height="19" rx="3.2"/><path d="M12 21.5v-5.2"/>',
      }
      const pill = document.getElementById('pill')
      const icon = document.getElementById('icon')
      const title = document.getElementById('title')
      const value = document.getElementById('value')
      const sub = document.getElementById('sub')
      const bar = document.getElementById('bar')
      const fill = document.getElementById('fill')

      window.__osdRender = (p) => {
        const root = document.documentElement
        root.style.setProperty('--accent', p.accent || '#8b5cf6')
        root.style.setProperty('--anim', `${p.animationMs ?? 180}ms`)
        root.style.setProperty('--bg-alpha', String(p.opacity ?? 0.92))
        icon.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[p.icon] || ICONS.perf}</svg>`
        title.textContent = p.title || ''
        value.textContent = p.value || ''
        sub.textContent = p.sub || ''
        if (typeof p.progress === 'number') {
          bar.classList.add('on')
          fill.style.width = `${Math.round(Math.max(0, Math.min(1, p.progress)) * 100)}%`
        } else {
          bar.classList.remove('on')
        }
        pill.classList.remove('show')
        pill.classList.toggle('from-left', p.slide === 'left')
        pill.classList.toggle('from-right', p.slide !== 'left')
        // 内容先落位再上动画，避免同一帧切换时闪一下
        requestAnimationFrame(() => pill.classList.add('show'))
      }
      window.__osdHide = () => pill.classList.remove('show')
    </script>
  </body>
</html>
